name: CI - Complete
on:
  push:
    branches:
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  full-quality-testing:
    name: Complete Quality Control (Unit, Integration & System Tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: goeventsnow_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install wait tools
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Dependencies
        run: | 
          cd frontend
          npm install
          
      - name: Compile Server & Run Backend Unit, Integration & API System Test 
        run: |
          cd backend
          mvn clean test -Dtest="EventServiceTest,ParticipantServiceTest,TicketServiceTest,UserServiceTest,ReviewServiceTest,EventRepositoryTest,ParticipantRepositoryTest,TicketRepositoryTest,UserRepositoryTest,ReviewRepositoryTest,AuthApiTest,EventApiTest,ParticipantApiTest,TicketApiTest,UserApiTest,GraphicApiTest,ReviewApiTest"
          mvn jacoco:report

      - name: Build Frontend
        run: |
          cd frontend
          npx ng build --configuration=production

      - name: Run Backend
        env:
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/goeventsnow_db?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          cd backend
          mvn spring-boot:run &
          echo "Waiting backend to be ready..."
          timeout 180s sh -c 'until curl -k https://localhost:8443/api/v1/events/; do sleep 5; done'

      - name: Run frontend unitary and integration tests
        run: |
          cd frontend

          rm -rf coverage
          npm run test:components
          mkdir -p coverage-reports
          cp coverage/frontend/lcov.info coverage-reports/lcov-components.info

          rm -rf coverage
          npm run test:integration
          cp coverage/frontend/lcov.info coverage-reports/lcov-services.info

          echo "Coverage reports:"
          find . -name "*.info"

      - name: Run Frontend
        run: |
          cd frontend
          npx ng serve --host 0.0.0.0 &
          echo "Waiting frontend to be in port 4200..."
          timeout 120s sh -c 'until nc -z localhost 4200; do sleep 5; done'

      - name: Run Frontend System Tests
        run: |
          cd backend
          mvn test -Dtest="EventE2ETest,ParticipantE2ETest,TicketE2ETest,UserE2ETest,ReviewE2ETest"

      - name: Generate Backend Coverage Report
        run: |
          cd backend
          mvn jacoco:report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
