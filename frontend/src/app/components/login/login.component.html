
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card border p-5 align-items-center justify-content-center" style="max-width: 480px; width: 100%; border-radius: 1rem;">
        <form (ngSubmit)="login()" #loginForm="ngForm" novalidate class="text-center">

            <div class="mb-4">
                <img src="/images/noImage.png" alt="GoEventsNow Logo" style="height: 120px; max-width: 100%; object-fit: contain;">
            </div>

            <h2 class="h5 fw-bold mb-1 text-dark">Welcome Back</h2>
            <p class="text-muted small mb-4">Enter your credentials to access your account</p>

            <div class="text-start mb-3">
                <label for="username" class="form-label fw-bold text-dark" style="font-size: 0.85rem;">Username</label>
                <input type="text" class="form-control bg-light border-0 py-2 rounded-3" id="username" name="username" [(ngModel)]="username"
                    placeholder="username">
            </div>

            <div class="text-start mb-4">
                <label for="password" class="form-label fw-bold text-dark" style="font-size: 0.85rem;">Password</label>
                <input type="password" class="form-control bg-light border-0 py-2 rounded-3" id="password" name="password" [(ngModel)]="password"
                    placeholder="••••••••">
            </div>

            <div class="d-grid mb-4">
                <button id="login-btn" type="submit" class="btn btn-primary fw-bold py-2 rounded-3">Login</button>
            </div>

            <p class="text-muted mb-0" style="font-size: 0.85rem;">
                Don't have an account? <a [routerLink]="['/register']" class="text-primary text-decoration-none fw-bold">Sign up</a>
            </p>

        </form>
    </div>
</div>
