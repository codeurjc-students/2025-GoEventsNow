<div class="container-fluid px-4 py-4">
    <div class="row">

        <div *ngIf="alertMessage" class="alert alert-danger" role="alert">
            {{alertMessageText}}
        </div>

        <div class="row g-4" id="participant-list">
            <h5 class="fw-bold mb-3">Manage Participants</h5>
            <p>Create, edit and delete participants</p>

            <div class="mt-auto d-flex justify-content-between align-items-end pt-3 border-top ">
                <a id="create-participant-link" class="btn btn-dark btn-sm rounded-pill px-4 fw-bold py-2" [routerLink]="['/create-participant']">Add
                    participant</a>
            </div>

            @for (participant of participants; track participant.id) {

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm border-1 border-light rounded-4 overflow-hidden">

                    <div class="position-relative" [class.bg-dark]="participant.participantImage"
                        style="height: 200px; background-color: #f8f9fa;">

                        @if (participant.participantImage) {
                        <img [src]="'/api/v1/participants/' + participant.id + '/image'"
                            class="w-100 h-100 object-fit-cover opacity-75" alt="Participant cover">
                        } @else {
                        <img src="/images/noImage.png" class="w-100 h-100 object-fit-contain"
                            alt="No participant cover available">
                        }

                    </div>

                    <div class="card-body p-4 d-flex flex-column">
                        <div class="mb-2">
                            <span
                                class="badge border border-secondary-subtle text-secondary fw-normal rounded-pill px-3 py-1 bg-transparent">
                                {{participant.type}}
                            </span>
                        </div>

                        <h3 id="participant-manage-name-{{participant.id}}" class="card-title h5 text-dark fw-bold mb-2">{{participant.name}}</h3>
                        <p class="text-muted mb-4">{{participant.biography}}</p>

                        <div class="mt-auto d-flex justify-content-end gap-2 pt-3 border-top">
                            <a id="edit-participant-{{participant.id}}" [routerLink]="['/edit-participant/', participant.id]"
                                class="btn btn-outline-dark btn-sm rounded-pill px-3 py-2 fw-bold d-flex align-items-center">
                                <i class="bi bi-pencil me-1"></i> Edit
                            </a>

                            <button id="delete-participant-{{participant.id}}" (click)="deleteParticipant(participant.id)"
                                class="btn btn-outline-danger btn-sm rounded-pill px-3 py-2 fw-bold d-flex align-items-center">
                                <i class="bi bi-trash me-1"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            }
        </div>

        <div class="text-center mt-5" *ngIf="hasMore">
            <button (click)="loadParticipants()" class="btn btn-outline-dark rounded-pill px-5">Load More
                Participants</button>
        </div>

    </div>
</div>
