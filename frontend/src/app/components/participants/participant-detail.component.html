@let participant = (participant$ | async);
@if (participant) {
    
<div class="position-relative"
    [style.background]="participant.participantImage ? 'url(/api/v1/participants/' + participant.id + '/image) center/cover no-repeat' : '#e9ecef'"
    style="height: 250px;">
    @if (participant.participantImage) {
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>
    }
</div>


<div class="container pb-5" style="margin-top: -80px; position: relative; z-index: 10;">

    <div class="row g-4">

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span
                            class="badge bg-dark text-white rounded-pill px-3 py-2 fw-normal">{{participant.type}}</span>
                    </div>

                    <h1 class="fw-bold text-dark mb-3">{{participant.name}}</h1>

                    <hr class="border-secondary-subtle mb-4">

                    <h5 class="fw-bold mb-3 text-dark">About {{participant.name}}</h5>
                    <p class="text-muted mb-5 lh-lg"> {{participant.biography}} </p>

                    <h5 class="fw-bold mb-4 text-dark">Upcoming Events (X)</h5>

                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 sticky-top" style="top: 20px;">
                <div class="card-body p-4 p-md-5">
                
                    <button class="btn btn-dark w-100 py-3 rounded-3 fw-bold mb-4">Follow</button>

                    <hr class="border-secondary-subtle">

                    <div class="d-flex justify-content-between mb-2 small text-muted">
                        <span>Followers</span>
                        <span>X</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4 small text-muted">
                        <span>Upcoming Events</span>
                        <span>X</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4 small text-muted">
                        <span>Category</span>
                        <span>{{participant.type}}</span>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>
}
